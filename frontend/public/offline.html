<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101C28" />
    <title>Offline | Kamalig Food House</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101C28;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 400px;
        background: #171B20;
        border: 1px solid rgba(246, 201, 40, 0.35);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #F6C928;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #F6C928;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        color: #d1d5db;
        line-height: 1.5;
      }
      .addr {
        font-size: 12px;
        color: #FFF1C6;
        background: #101C28;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      button {
        background: #F6C928;
        color: #101C28;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/kamalig-logo.png" alt="Kamalig Food House" />
      <h1>You’re Currently Offline</h1>
      <p>Good Food, Great Mood! Reconnect to the internet to browse the latest Kamalig Food House menu and live directions.</p>
      <div class="addr">
        <strong>Official Location:</strong><br />
        130 CCF Village, Brgy. Mayao Parada, Lucena City
      </div>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
